name: Deploy site to Pages
# public/ 是入库的 SPA 构建产物（vite build 后由 dist/ 同步，含目录数据 brand-index.json）。
# 数据或前端变更后：npm run build（web/）→ 同步 dist 到 public/ → 提交推送即可触发部署。
on:
  push:
    branches: [main]
    paths: ['public/**', 'web/**', 'datasets/brands-all.json', 'tools/build-index.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch registry data from Releases
        run: node tools/fetch-registry.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage site (dist -> public, public 不再入库)
        run: |
          rm -rf public
          mkdir -p public
          cp -r web/dist/* public/

      - name: Generate crawlable brand pages
        run: node tools/gen-brand-pages.cjs --out public/brands --top 5000

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
