<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEO AUDIT 品牌目录 — 1000 个品牌信息卡</title>
<meta name="description" content="EEO 品牌目录：收录 1000 个品牌的信息卡，支持中英文搜索、行业门类浏览、国家筛选与 GitHub PR 官方认领。">
<meta property="og:title" content="EEO AUDIT 品牌目录">
<meta property="og:description" content="1000 个品牌信息卡 · 搜索 · 筛选 · 官方认领">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E293B'/%3E%3Ctext x='16' y='21.5' font-family='Segoe UI,Arial' font-size='12' font-weight='700' fill='%23fff' text-anchor='middle'%3EEEO%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --border-strong:#CBD5E1;
  --text:#1E293B; --text-strong:#0F172A; --muted:#64748B; --muted-2:#94A3B8;
  --accent:#2563EB; --accent-hover:#1D4ED8; --accent-soft:#EFF6FF;
  --green:#059669; --green-soft:#ECFDF5;
  --amber:#B45309; --amber-soft:#FFFBEB;
  --radius:8px; --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,.16);
  --nav-h:60px; --side-w:236px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
button{font-family:inherit;cursor:pointer}
img,svg{vertical-align:middle}
::selection{background:#DBEAFE}
body.no-scroll{overflow:hidden}

/* ============ 顶部导航 ============ */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1400px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:16px;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text-strong);flex-shrink:0}
.logo:hover{color:var(--text-strong)}
.logo-mark{width:34px;height:34px;border-radius:8px;background:var(--text-strong);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.5px}
.logo-text{display:flex;flex-direction:column;line-height:1.15;font-weight:700;font-size:15px}
.logo-text small{font-weight:400;font-size:11px;color:var(--muted)}
.nav-search{flex:1;display:flex;align-items:center;max-width:520px;margin:0 auto;position:relative}
.nav-search .ico{position:absolute;left:12px;color:var(--muted-2);pointer-events:none}
.nav-search input{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;padding:0 34px 0 36px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.nav-search .clear{position:absolute;right:6px;border:none;background:none;color:var(--muted-2);width:26px;height:26px;border-radius:6px;display:none;align-items:center;justify-content:center}
.nav-search .clear:hover{background:var(--bg);color:var(--muted)}
.nav-search.has-q .clear{display:flex}
.nav-actions{display:flex;gap:8px;flex-shrink:0}
.menu-btn{display:none;border:1px solid var(--border);background:#fff;width:38px;height:38px;border-radius:8px;align-items:center;justify-content:center;color:var(--muted)}
.menu-btn:hover{background:var(--bg)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);color:#fff}
.btn.ghost{background:#fff;border-color:var(--border-strong);color:var(--text)}
.btn.ghost:hover{border-color:var(--muted-2);background:var(--bg)}
.btn.sm{height:32px;padding:0 10px;font-size:12px}

/* ============ 布局 ============ */
.layout{max-width:1400px;margin:0 auto;display:flex;align-items:flex-start;padding:0 20px;flex:1 0 auto;width:100%}
.sidebar{width:var(--side-w);flex-shrink:0;position:sticky;top:var(--nav-h);max-height:calc(100vh - var(--nav-h));overflow-y:auto;padding:20px 16px 32px 0}
.main{flex:1;min-width:0;padding:20px 0 48px 28px}
.side-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted-2);text-transform:uppercase;padding:4px 10px 8px}
.side-nav{display:flex;flex-direction:column;gap:1px}
.side-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text);font-size:13.5px;border:none;background:none;text-align:left;width:100%;transition:background .12s}
.side-link:hover{background:#F1F5F9}
.side-link.active{background:var(--accent-soft);color:var(--accent-hover);font-weight:600}
.side-link .cnt{font-size:11.5px;color:var(--muted-2);background:#F1F5F9;border-radius:99px;padding:1px 8px;flex-shrink:0}
.side-link.active .cnt{background:#DBEAFE;color:var(--accent-hover)}
.drawer-bg{display:none}

/* ============ 页头 / 筛选栏 ============ */
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.page-head h1{font-size:22px;font-weight:700;color:var(--text-strong)}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.filters select{height:34px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;color:var(--text);font-size:13px;padding:0 8px;outline:none;max-width:180px}
.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.result-info{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.link-btn{border:none;background:none;color:var(--accent);font-size:12.5px;padding:4px 6px;border-radius:6px}
.link-btn:hover{background:var(--accent-soft)}

/* ============ 卡片网格 ============ */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;box-shadow:var(--shadow-sm);outline:none}
.card:hover,.card:focus-visible{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-strong)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-name{font-size:16px;font-weight:700;color:var(--text-strong);line-height:1.35;word-break:break-word}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;line-height:1.6;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-ind{background:var(--accent-soft);color:#1D4ED8}
.card-loc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;min-height:18px}
.cc{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);background:#F1F5F9;border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:17px}
.card-desc{font-size:13.5px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--border)}
.site-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--accent);padding:3px 6px;border-radius:6px}
.site-link:hover{background:var(--accent-soft)}
.go-detail{font-size:12px;color:var(--muted-2)}

/* 徽章 */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;flex-shrink:0;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.unclaimed{background:#F1F5F9;color:#64748B}
.badge.claimed{background:var(--green-soft);color:var(--green)}
.badge.claiming{background:var(--amber-soft);color:var(--amber)}

/* ============ 分组展示 ============ */
.group{margin-bottom:26px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.group-head h3{font-size:15px;font-weight:700;color:var(--text-strong)}
.group-head .cnt{font-size:12px;color:var(--muted);background:#F1F5F9;padding:1px 9px;border-radius:99px}

/* ============ 分页 ============ */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:26px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.pager button:hover:not(:disabled):not(.active){border-color:var(--accent);color:var(--accent)}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pager button:disabled{opacity:.4;cursor:default}
.pager .dots{color:var(--muted-2);padding:0 2px}
.pager-info{width:100%;text-align:center;font-size:12px;color:var(--muted-2);margin-top:6px}

/* ============ 首页 Hero ============ */
.hero{text-align:center;padding:52px 16px 40px;max-width:860px;margin:0 auto}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent-hover);background:var(--accent-soft);border:1px solid #DBEAFE;border-radius:99px;padding:4px 14px;margin-bottom:18px}
.hero h1{font-size:clamp(28px,4.5vw,42px);font-weight:800;color:var(--text-strong);letter-spacing:-.01em;margin-bottom:6px}
.hero-num{font-size:clamp(56px,9vw,88px);font-weight:800;color:var(--text-strong);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-num-label{font-size:15px;color:var(--muted);margin:2px 0 24px}
.hero-search{display:flex;align-items:center;position:relative;max-width:620px;margin:0 auto 12px}
.hero-search .ico{position:absolute;left:16px;color:var(--muted-2);pointer-events:none}
.hero-search input{width:100%;height:50px;border:1.5px solid var(--border-strong);border-radius:12px;background:#fff;padding:0 44px 0 46px;font-size:15.5px;color:var(--text);outline:none;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.hero-search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.hero-search .clear{position:absolute;right:8px;border:none;background:none;color:var(--muted-2);width:32px;height:32px;border-radius:8px;display:none;align-items:center;justify-content:center}
.hero-search .clear:hover{background:var(--bg)}
.hero-search.has-q .clear{display:flex}
.hero-hint{font-size:13px;color:var(--muted-2);margin-bottom:30px}
.hero-stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hero-stats b{color:var(--text-strong);font-size:15px;font-weight:700;margin-right:4px}

.home-section{margin-top:40px}
.home-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.home-section-head h2{font-size:18px;font-weight:700;color:var(--text-strong)}
.home-section-head p{font-size:13px;color:var(--muted);margin-top:2px}
.cat-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cat-tile{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;color:var(--text);transition:all .15s;box-shadow:var(--shadow-sm)}
.cat-tile:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px);color:var(--text)}
.cat-tile .t{font-size:14px;font-weight:600}
.cat-tile .n{font-size:12px;color:var(--muted);flex-shrink:0}

/* ============ 弹窗 ============ */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-root[hidden]{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.55);animation:fadeIn .15s ease}
.modal-card{position:relative;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:620px;max-height:min(86vh,780px);display:flex;flex-direction:column;animation:pop .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 0}
.modal-head h2{font-size:21px;font-weight:800;color:var(--text-strong);line-height:1.3;word-break:break-word}
.modal-close{border:none;background:var(--bg);color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:#E2E8F0;color:var(--text)}
.modal-body{padding:14px 22px 22px;overflow-y:auto}
.alias-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.alias-row .lbl{font-size:12px;color:var(--muted-2);padding-top:2px;flex-shrink:0}
.chip{display:inline-block;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:1px 10px}
.meta-grid{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13.5px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.meta-grid dt{color:var(--muted-2);font-size:12.5px;padding-top:1px}
.meta-grid dd{color:var(--text);word-break:break-word}
.modal-desc{font-size:14px;line-height:1.75;margin-bottom:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--text-strong);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border)}
.adv-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.adv-list li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.6}
.adv-list li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.src-list{display:flex;flex-direction:column;gap:6px}
.src-list a{display:inline-flex;align-items:center;gap:6px;font-size:13px;word-break:break-all}
.modal-foot{display:flex;gap:10px;padding:0 22px 22px;flex-wrap:wrap}
.modal-foot .btn{height:40px;padding:0 18px}

/* ============ 其他 ============ */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h3{font-size:16px;color:var(--text-strong);margin-bottom:6px}
.empty p{font-size:13.5px;margin-bottom:16px}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.loading .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1000px;margin:0 auto}
.skel{height:170px;border-radius:var(--radius);background:linear-gradient(100deg,#F1F5F9 40%,#E2E8F0 50%,#F1F5F9 60%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.footer{border-top:1px solid var(--border);background:#fff;margin-top:20px}
.footer-inner{max-width:1400px;margin:0 auto;padding:26px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
#resultsTop{scroll-margin-top:calc(var(--nav-h) + 12px)}

/* ============ 响应式 ============ */
@media (max-width:1099px){
  .grid,.skel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cat-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:1023px){
  .menu-btn{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;max-height:none;z-index:120;background:#fff;border-right:1px solid var(--border);padding:18px 14px;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .drawer-bg{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawer-bg.show{opacity:1;pointer-events:auto}
  .main{padding-left:0}
}
@media (max-width:719px){
  .grid,.skel-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cat-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav-inner{gap:10px;padding:0 12px}
  .logo-text{display:none}
  .nav-actions .btn.ghost span{display:none}
  .nav-actions .btn.ghost{width:38px;padding:0;justify-content:center}
  .nav-actions .btn.primary{padding:0 10px;font-size:12.5px}
  .nav-search input{padding-right:12px}
  .nav-search .clear{display:none !important}
  .hero{padding:34px 8px 28px}
  .hero-stats{gap:14px;font-size:12px}
  .card{padding:12px 12px 10px}
  .card-name{font-size:15px}
  .card-desc{-webkit-line-clamp:2;font-size:12.5px}
  .go-detail{display:none}
  .filters{gap:6px;padding:8px}
  .filters select{max-width:calc(50% - 4px);flex:1}
  .result-info{width:100%;margin-left:0}
  .modal-root{padding:10px}
  .modal-head{padding:16px 16px 0}
  .modal-body{padding:12px 16px 16px}
  .modal-foot{padding:0 16px 16px}
}
@media (max-width:400px){
  .card-desc{display:none}
}
</style>
</head>
<body>
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">EEO 品牌目录需要启用 JavaScript 才能浏览。</div></noscript>

<header class="nav">
  <div class="nav-inner">
    <button class="menu-btn" id="menuBtn" aria-label="打开行业分类菜单" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="#/" aria-label="EEO AUDIT 品牌目录 首页">
      <span class="logo-mark">EEO</span>
      <span class="logo-text">EEO AUDIT<small>品牌目录</small></span>
    </a>
    <div class="nav-search" id="navSearchWrap">
      <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input id="navQ" type="search" placeholder="搜索品牌 / 行业 / 城市" autocomplete="off" aria-label="搜索品牌">
      <button class="clear" id="navQClear" aria-label="清空搜索"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

  });
  COUNTRIES = Object.keys(cMap).map(function(k){
    return { name:k, count:cMap[k] };
  }).sort(function(a,b){ return b.count-a.count; });
  pickRandom();
  applyHash();
  if(window.innerWidth >= 720 && state.view==='home' && !$('navQ').value){ $('navQ').focus(); }
}

/* ---------- 路由 ---------- */
function applyHash(){
  var h = location.hash.replace(/^#\/?/,'');
  if(h.indexOf('cat/')===0){
    var c = decodeURIComponent(h.slice(4));
    state.view = 'cat';
    state.cat = CATS.indexOf(c)>=0 ? c : null;
    if(!state.cat) state.view='browse';
    state.page = 1;
  } else if(h==='browse'){
    state.view='browse'; state.cat=null; state.page=1;
  } else {
    state.view='home'; state.cat=null;
  }
  renderAll();
}
function goHash(h){ if(location.hash===h){ applyHash(); } else { location.hash=h; } }

/* ---------- 过滤 ---------- */
function filteredBrands(){
  var list = BRANDS;
  if(state.cat) list = list.filter(function(b){ return b.cat===state.cat; });
  var q = t2s(state.q.trim()).toLowerCase();
  if(q) list = list.filter(function(b){ return b.hay.indexOf(q)>=0; });
  if(state.country==='__none__') list = list.filter(function(b){ return !b.country; });
  else if(state.country!=='__all__') list = list.filter(function(b){ return b.country===state.country; });
  if(state.claim!=='all') list = list.filter(function(b){ return ((b.claim&&b.claim.status)||'unclaimed')===state.claim; });
  if(state.sort==='name') list = list.slice().sort(function(a,b){ return collator.compare(a.name,b.name); });
  else if(state.sort==='industry') list = list.slice().sort(function(a,b){ return collator.compare(a.sub,b.sub)||collator.compare(a.name,b.name); });
  return list;
}
function anyFilterActive(){
  return !!(state.q.trim() || state.country!=='__all__' || state.claim!=='all' || state.sort!=='default');
}
function clearFilters(){
  state.q=''; state.country='__all__'; state.claim='all'; state.sort='default'; state.page=1;
  $('navQ').value=''; syncSearchUI();
  renderMain();
}

/* ---------- 渲染：侧边栏 ---------- */
function renderSidebar(){
  var html = '<div class="side-title">行业门类</div><nav class="side-nav">'
    + '<button class="side-link'+(state.view==='browse'&&!state.cat?' active':'')+'" data-cat="">全部品牌<span class="cnt">'+BRANDS.length.toLocaleString()+'</span></button>';
  CATS.forEach(function(c){
    html += '<button class="side-link'+(state.cat===c?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="cnt">'+CAT_COUNTS[c]+'</span></button>';
  });
  html += '</nav>';
  $('sidebar').innerHTML = html;
}

/* ---------- 渲染：卡片 ---------- */
function cardHtml(b){
  var cv = claimView(b);
  var loc = '';
  if(b.city && b.country) loc = '<span>'+esc(b.city)+'</span><span class="cc" title="'+esc(b.country)+'">'+esc(COUNTRY_CODE[b.country]||b.country)+'</span>';
  else if(b.city) loc = '<span>'+esc(b.city)+'</span>';
  else if(b.country) loc = '<span class="cc" title="'+esc(b.country)+'">'+esc(COUNTRY_CODE[b.country]||b.country)+'</span><span>'+esc(b.country)+'</span>';
  else loc = '<span>地区未标注</span>';
  var site = b.website ? '<a class="site-link" href="'+esc(b.website)+'" target="_blank" rel="noopener noreferrer" data-stop>官网<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>' : '<span></span>';
  var desc = firstSentence(b.description);
  return '<article class="card" data-open="'+b.id+'" tabindex="0" role="button" aria-label="查看 '+esc(b.name)+' 详情">'
    + '<div class="card-top"><h3 class="card-name">'+esc(b.name)+'</h3><span class="badge '+cv.cls+'">'+cv.label+'</span></div>'
    + (b.industry?'<div><span class="tag tag-ind" title="'+esc(b.industry)+'">'+esc(b.industry)+'</span></div>':'')
    + '<div class="card-loc">'+loc+'</div>'
    + (desc?'<p class="card-desc">'+esc(desc)+'</p>':'')
    + '<div class="card-foot">'+site+'<span class="go-detail">查看详情</span></div>'
    + '</article>';
}

/* ---------- 渲染：筛选栏 ---------- */
function filterBarHtml(total){
  var countryOpts = '<option value="__all__">全部国家/地区</option>';
  COUNTRIES.forEach(function(c){
    var v = c.name, lbl = c.name==='__none__' ? '未标注' : c.name;
    countryOpts += '<option value="'+esc(v)+'"'+(state.country===v?' selected':'')+'>'+esc(lbl)+'（'+c.count+'）</option>';
  });
  var catOpts = '<option value="">全部门类</option>';
  CATS.forEach(function(c){ catOpts += '<option value="'+esc(c)+'"'+(state.cat===c?' selected':'')+'>'+esc(c)+'</option>'; });
  var claimOpts = [['all','认领状态'],['unclaimed','待认领'],['claiming','认领核验中'],['claimed','已认领']].map(function(o){
    return '<option value="'+o[0]+'"'+(state.claim===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
  var sortOpts = [['default','排序：默认'],['name','排序：名称'],['industry','排序：行业']].map(function(o){
    return '<option value="'+o[0]+'"'+(state.sort===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
  return '<div class="filters" id="resultsTop">'
    + '<select id="fCat" aria-label="行业门类筛选">'+catOpts+'</select>'
    + '<select id="fCountry" aria-label="国家筛选">'+countryOpts+'</select>'
    + '<select id="fClaim" aria-label="认领状态筛选">'+claimOpts+'</select>'
    + '<select id="fSort" aria-label="排序">'+sortOpts+'</select>'
    + '<span class="result-info">共 <b>'+total.toLocaleString()+'</b> 个品牌'+(anyFilterActive()?' · <button class="link-btn" data-action="clear-filters">清除筛选</button>':'')+'</span>'
    + '</div>';
}

/* ---------- 渲染：分页 ---------- */
function pagerHtml(page,pages){
  if(pages<=1) return '';
  var btn = function(p,label,dis,active){
    return '<button data-page="'+p+'"'+(dis?' disabled':'')+(active?' class="active"':'')+(label?' aria-label="第'+p+'页"':'')+'>'+(label||p)+'</button>';
  };
  var items = [];
  items.push(btn(page-1,'‹',page<=1));
  var win = [];
  for(var p=1;p<=pages;p++){
    if(p===1||p===pages||Math.abs(p-page)<=2) win.push(p);
  }
  var prev = 0;
  win.forEach(function(p){
    if(p-prev>1) items.push('<span class="dots">…</span>');
    items.push(btn(p,'',false,p===page));
    prev = p;
  });
  items.push(btn(page+1,'›',page>=pages));
  return '<nav class="pager" aria-label="分页">'+items.join('')
    + '<div class="pager-info">第 '+page+' / '+pages+' 页 · 每页 '+PER_PAGE+' 条</div></nav>';
}

/* ---------- 渲染：主区域 ---------- */
function renderMain(){
  if(state.view==='home'){ renderHome(); return; }
  var list = filteredBrands();
  var head = '';
  if(state.view==='cat' && state.cat){
    var subSet = {};
    list.forEach(function(b){ subSet[b.sub||'未分类']=1; });
    head = '<div class="page-head"><h1>'+esc(state.cat)+'</h1></div>'
      + '<p class="page-sub">'+list.length.toLocaleString()+' 个品牌 · '+(Object.keys(subSet).length)+' 个子行业 · 门类内可直接搜索</p>';
  } else {
    head = '<div class="page-head"><h1>全部品牌</h1></div>';
  }

  if(!list.length){
    $('main').innerHTML = head + filterBarHtml(0)
      + '<div class="empty"><h3>没有找到匹配的品牌</h3><p>换个关键词，或放宽筛选条件试试</p><button class="btn ghost" data-action="clear-filters">清除全部筛选</button></div>';
    return;
  }

  if(state.view==='cat'){
    /* 门类视图：按子行业分组展示 */
    var groups = {};
    list.forEach(function(b){ var k=b.sub||'未分类'; (groups[k]=groups[k]||[]).push(b); });
    var keys = Object.keys(groups).sort(function(a,b){
      return groups[b].length-groups[a].length || collator.compare(a,b);
    });
    var body = keys.map(function(k){
      var bs = groups[k];
      if(state.sort==='name') bs = bs.slice().sort(function(a,b){ return collator.compare(a.name,b.name); });
      return '<section class="group"><div class="group-head"><h3>'+esc(k)+'</h3><span class="cnt">'+bs.length+' 个品牌</span></div>'
        + '<div class="grid">'+bs.map(cardHtml).join('')+'</div></section>';
    }).join('');
    $('main').innerHTML = head + filterBarHtml(list.length) + body;
  } else {
    /* 列表视图：分页网格 */
    var pages = Math.ceil(list.length/PER_PAGE);
    if(state.page>pages) state.page=pages;
    var slice = list.slice((state.page-1)*PER_PAGE, state.page*PER_PAGE);
    $('main').innerHTML = head + filterBarHtml(list.length)
      + '<div class="grid">'+slice.map(cardHtml).join('')+'</div>'
      + pagerHtml(state.page,pages);
  }
}

/* ---------- 渲染：首页 ---------- */
function pickRandom(){
  var pool = BRANDS.slice();
  randomPicks = [];
  for(var i=0;i<3 && pool.length;i++){
    randomPicks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);

}

    +   '<input id="heroQ" type="search" placeholder="输入品牌名、行业或城市，支持中英文" autocomplete="off" aria-label="搜索品牌">'

    + '</div>'
    + '<p class="hero-hint">收录即公开，认领需官网核验 — 每一条认领记录都是一条公开可查的 PR</p>'
    + '<div class="hero-stats"><span><b>'+nCountries+'</b>个国家/地区</span><span><b>'+CATS.length+'</b>个行业门类</span><span><b>100%</b>数据公开</span></div>'
    + '</section>'
    + '<section class="home-section"><div class="home-section-head"><div><h2>热门行业</h2><p>按收录数量排序的门类快捷入口</p></div></div><div class="cat-tiles">'+tiles+'</div></section>'
    + '<section class="home-section"><div class="home-section-head"><div><h2>品牌速览</h2><p>随机展示三个品牌，点击卡片查看完整信息卡</p></div><button class="btn ghost sm" data-action="refresh-random"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>换一批</button></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+cards+'</div></section>';

/* ---------- 搜索 ---------- */
function setSearch(q, fromEl){
  state.q = q; state.page = 1;

/* ---------- 弹窗 ---------- */
function openModal(id){

  function row(k,v){ return '<dt>'+k+'</dt><dd>'+v+'</dd>'; }

  rows += row('门类','<span class="chip">'+esc(b.cat)+'</span>');
  rows += row('城市', b.city?esc(b.city):'<span style="color:var(--muted-2)">未标注</span>');
  if(b.country){
    var cc = COUNTRY_CODE[b.country];
    rows += row('国家/地区', (cc?'<span class="cc" style="margin-right:6px">'+esc(cc)+'</span>':'')+esc(b.country));
  }
  if(b.founded) rows += row('成立时间', esc(b.founded));
  if(b.confidence) rows += row('信息可信度', esc(CONF_VIEW[b.confidence]||b.confidence));
  var claimCell = '<span class="badge '+cv.cls+'">'+cv.label+'</span>';
  if(b.claim&&b.claim.status==='claimed'&&b.claim.claimed_at) claimCell += '<span style="margin-left:8px;color:var(--muted);font-size:12px">'+esc(String(b.claim.claimed_at).slice(0,10))+'</span>';
  if(b.claim&&b.claim.status==='claiming'&&b.claim.domain) claimCell += '<span style="margin-left:8px;color:var(--muted);font-size:12px">核验域名：'+esc(b.claim.domain)+'</span>';
  rows += row('认领状态', claimCell);

  if(b.wikidata) rows += row('Wikidata','<a href="https://www.wikidata.org/wiki/'+esc(b.wikidata)+'" target="_blank" rel="noopener noreferrer">'+esc(b.wikidata)+'</a>');

  var aliases = b.aliases.length ? b.aliases.map(function(a){ return '<span class="chip">'+esc(a)+'</span>'; }).join(' ') : '<span style="color:var(--muted-2);font-size:12px">无</span>';

  var body = '<div class="alias-row"><span class="lbl">别名</span>'+aliases+'</div>'

      + b.faq.map(function(f){

  $('sidebar').classList.toggle('open', open);

}

/* ---------- 总渲染 ---------- */
function renderAll(){
  renderSidebar();

}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', function(e){
  /* 官网等站内阻冒泡链接 */
  var stop = e.target.closest('[data-stop]');
  if(stop){ e.stopPropagation(); return; }

  var card = e.target.closest('[data-open]');
  if(card){ openModal(parseInt(card.getAttribute('data-open'),10)); return; }

  var side = e.target.closest('.side-link');
  if(side){
    var c = side.getAttribute('data-cat');
    setDrawer(false);
    goHash(c ? '#/cat/'+encodeURIComponent(c) : '#/browse');
    return;
  }

  var act = e.target.closest('[data-action]');
  if(act){
    var a = act.getAttribute('data-action');
    if(a==='clear-filters') clearFilters();
    else if(a==='refresh-random'){ pickRandom(); renderMain(); }
    return;
  }

  var pg = e.target.closest('[data-page]');
  if(pg && !pg.disabled){
    state.page = parseInt(pg.getAttribute('data-page'),10);
    renderMain();
    var top = $('resultsTop'); if(top) top.scrollIntoView({behavior:'smooth',block:'start'});
  }
});
/* 键盘：卡片回车打开 */
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(!$('modalRoot').hidden) closeModal();
    else if($('sidebar').classList.contains('open')) setDrawer(false);
    return;
  }
  if((e.key==='Enter'||e.key===' ') && document.activeElement && document.activeElement.classList &&
     document.activeElement.classList.contains('card') && e.target===document.activeElement){
    e.preventDefault();
    openModal(parseInt(document.activeElement.getAttribute('data-open'),10));
  }
});
$('modalMask').addEventListener('click', closeModal);
$('drawerBg').addEventListener('click', function(){ setDrawer(false); });

/* 筛选器（事件委托，主区域每次重绘） */

  else if(t.id==='fClaim'){ state.claim=t.value; state.page=1; renderMain(); }

});
